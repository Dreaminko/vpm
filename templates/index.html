<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__LISTING_NAME__</title>
  <meta name="description" content="__DESCRIPTION__" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2374d6ff'/%3E%3Cpath d='M9.5 11.5h13M16 11.5v10.5M12 22h8' stroke='%2312394b' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('dreaminko-vpm-theme') || localStorage.getItem('unitext-vpm-theme');
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --font-ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      --font-mono: "Cascadia Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

      --canvas: #f5f8fb;
      --surface: #ffffff;
      --surface-subtle: #eef2f7;
      --surface-elevated: #f9fbfd;

      --text: #1d2834;
      --text-secondary: #5a6878;
      --text-quiet: #8b98a7;

      --border: #dde2e9;
      --border-strong: #cdd4dd;

      --primary: #74d6ff;
      --primary-hover: #56c8f5;
      --primary-ink: #17617d;
      --on-primary: #12394b;
      --primary-soft: #dff6ff;
      --primary-softer: #f0fbff;

      --warning: #9a6418;
      --warning-soft: #fff7e8;
      --warning-border: #efd6a8;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-pill: 999px;

      --card-shadow: 0 10px 36px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.03);
      --control-shadow: 0 1px 2px rgba(0, 0, 0, 0.035);
      --focus-shadow: 0 0 0 3px rgba(116, 214, 255, 0.18), var(--control-shadow);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #282c33;
      --surface: #2f343e;
      --surface-subtle: #282c33;
      --surface-elevated: #3b414d;

      --text: #dce0e5;
      --text-secondary: #a9afbc;
      --text-quiet: #878a98;

      --border: #363c46;
      --border-strong: #464b57;

      --primary: #3fb9ec;
      --primary-hover: #2ba6db;
      --primary-ink: #7fd8ff;
      --on-primary: #0d2633;
      --primary-soft: rgba(116, 214, 255, 0.14);
      --primary-softer: rgba(116, 214, 255, 0.08);

      --warning: #dec184;
      --warning-soft: rgba(222, 193, 132, 0.1);
      --warning-border: #5d4c2f;

      --card-shadow: 0 12px 36px rgba(0, 0, 0, 0.22), 0 1px 3px rgba(0, 0, 0, 0.16);
      --control-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      --focus-shadow: 0 0 0 3px rgba(116, 214, 255, 0.24), var(--control-shadow);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(116, 214, 255, 0.48) transparent;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(116, 214, 255, 0.48);
      border-radius: var(--radius-pill);
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(116, 214, 255, 0.72);
      background-clip: content-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 180ms var(--ease-out), color 180ms var(--ease-out);
    }

    a {
      color: var(--primary-ink);
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      outline: none;
      box-shadow: var(--focus-shadow);
    }

    .shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-pill);
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 650;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .topbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      box-shadow: var(--control-shadow);
      cursor: pointer;
      padding: 0;
      transition:
        background-color 150ms var(--ease-out),
        border-color 150ms var(--ease-out),
        color 150ms var(--ease-out),
        transform 140ms var(--ease-out);
    }

    .icon-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: var(--surface);
    }

    .icon-btn:active { transform: scale(0.95); }

    .icon-sun { display: none; }
    .icon-moon { display: block; }
    :root[data-theme="dark"] .icon-sun { display: block; }
    :root[data-theme="dark"] .icon-moon { display: none; }

    /* Floating Surface Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out);
    }

    .hero-card {
      padding: 28px;
      margin-bottom: 16px;
    }

    .versions-card {
      padding: 24px 28px;
    }

    /* Multi-Package Stack & Package Cards */
    .packages-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .package-card {
      padding: 24px 28px;
    }

    .package-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 4px;
    }

    .package-title-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      min-width: 0;
    }

    .package-desc {
      margin: 6px 0 14px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .package-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      margin-bottom: 16px;
    }

    .dep-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .dep-pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .package-links {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .package-link {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      transition:
        background-color 150ms var(--ease-out),
        border-color 150ms var(--ease-out),
        color 150ms var(--ease-out);
    }

    .package-link:hover {
      background: var(--surface-elevated);
      border-color: var(--border-strong);
      color: var(--primary-ink);
    }

    .versions-details > summary {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      list-style: none;
      margin-bottom: 10px;
      border-radius: var(--radius-sm);
    }

    .versions-details > summary::-webkit-details-marker { display: none; }
    .versions-details > summary:hover { color: var(--primary-ink); }

    .hero-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: -0.015em;
      color: var(--text);
    }

    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.3;
      color: var(--text);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 9px;
      border-radius: var(--radius-pill);
      background: var(--primary-soft);
      color: var(--primary-ink);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    .chip-mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .chip-sm {
      min-height: 20px;
      padding: 1px 7px;
      font-size: 10.5px;
    }

    .hero-desc {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    /* Action Buttons */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition:
        background-color 150ms var(--ease-out),
        border-color 150ms var(--ease-out),
        color 150ms var(--ease-out),
        transform 140ms var(--ease-out);
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      border: 1px solid transparent;
      box-shadow: var(--control-shadow);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: var(--on-primary);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      box-shadow: var(--control-shadow);
    }

    .btn-secondary:hover {
      background: var(--surface-elevated);
      border-color: var(--border-strong);
      color: var(--text);
    }

    /* Copyable VPM URL Bar */
    .url-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 6px 14px;
      margin-bottom: 16px;
      border-radius: var(--radius-md);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
    }

    .url-label {
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-quiet);
      flex-shrink: 0;
    }

    .url-code {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text);
      user-select: all;
    }

    .url-code::-webkit-scrollbar { display: none; }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--primary-soft);
      color: var(--primary-ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition:
        background-color 150ms var(--ease-out),
        color 150ms var(--ease-out),
        transform 140ms var(--ease-out);
    }

    .btn-copy:hover {
      background: var(--primary);
      color: var(--on-primary);
    }

    .btn-copy:active { transform: scale(0.97); }

    .btn-copy .icon-check { display: none; }
    .btn-copy.is-copied .icon-copy { display: none; }
    .btn-copy.is-copied .icon-check { display: block; }
    .btn-copy.is-copied {
      background: var(--primary);
      color: var(--on-primary);
    }

    /* Warning Notice */
    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      background: var(--warning-soft);
      border: 1px solid var(--warning-border);
      color: var(--warning);
      font-size: 12.5px;
      line-height: 1.5;
    }

    .notice svg {
      flex-shrink: 0;
      margin-top: 2px;
    }

    .notice code {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 1px 5px;
      border-radius: 5px;
      background: rgba(154, 100, 24, 0.1);
    }

    :root[data-theme="dark"] .notice code {
      background: rgba(222, 193, 132, 0.14);
    }

    /* Versions Table */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .release-count {
      font-size: 12px;
      color: var(--text-quiet);
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 0 -4px;
      padding: 0 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 0 10px 10px 0;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-quiet);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th:last-child,
    td:last-child {
      text-align: right;
      padding-right: 0;
    }

    td {
      padding: 13px 10px 13px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
      padding-bottom: 2px;
    }

    tbody tr {
      transition: background-color 140ms var(--ease-out);
    }

    tbody tr:hover td {
      background: var(--primary-softer);
    }

    .pkg-id {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text);
    }

    .ver-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .ver-num {
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .sha-code {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-quiet);
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: var(--radius-sm);
      background: var(--primary-soft);
      color: var(--primary-ink);
      font-size: 12px;
      font-weight: 600;
      transition:
        background-color 150ms var(--ease-out),
        color 150ms var(--ease-out),
        transform 140ms var(--ease-out);
    }

    .btn-download:hover {
      background: var(--primary);
      color: var(--on-primary);
    }

    .btn-download:active { transform: scale(0.97); }

    .empty-state {
      text-align: center;
      padding: 24px 0 8px;
      color: var(--text-quiet);
      font-size: 13px;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 18px;
      padding: 0 6px;
      font-size: 12px;
      color: var(--text-quiet);
    }

    .footer a {
      color: var(--text-secondary);
      transition: color 140ms var(--ease-out);
    }

    .footer a:hover { color: var(--primary-ink); }

    .footer-links {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .footer-sep { opacity: 0.5; }

    @media (max-width: 600px) {
      .shell { padding: 20px 14px 36px; }
      .hero-card { padding: 20px; }
      .versions-card, .package-card { padding: 18px 20px; }
      h1 { font-size: 19px; }
      .actions .btn { flex: 1 1 100%; }
      .url-bar { flex-wrap: wrap; padding: 10px 10px 10px 12px; }
      .url-label { width: 100%; }
      .col-sha { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="brand-name">__BRAND_NAME__</span>
        <span class="brand-tag">VPM</span>
      </div>
      <div class="topbar-actions">
        <a class="icon-btn" href="__AUTHOR_URL__" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile" title="GitHub">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </a>
        <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">
          <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="card hero-card">
        <div class="hero-header">
          <h1>__LISTING_NAME__</h1>
          __SUMMARY_CHIP__
        </div>
        <p class="hero-desc">__DESCRIPTION__</p>

        <div class="actions">
          <a class="btn btn-primary" href="__VCC_URI__">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            <span>Add to VCC</span>
          </a>
          <a class="btn btn-secondary" href="index.json">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></svg>
            <span>Browse index.json</span>
          </a>
        </div>

        <div class="url-bar">
          <span class="url-label">VPM URL</span>
          <code class="url-code">__LISTING_URL__</code>
          <button type="button" class="btn-copy" id="copy-url-btn" data-copy="__LISTING_URL__">

  <script>
    (function () {
      var root = document.documentElement;
      var themeBtn = document.getElementById('theme-toggle');
      function syncThemeBtn() {
        if (!themeBtn) return;
        var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        themeBtn.setAttribute('aria-pressed', current === 'dark' ? 'true' : 'false');
        themeBtn.setAttribute('title', current === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      syncThemeBtn();
      if (themeBtn) {
        themeBtn.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('dreaminko-vpm-theme', next); } catch (e) {}
          syncThemeBtn();
        });
      }

      var copyBtn = document.getElementById('copy-url-btn');
      var copyTimer = null;
      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
      }
      function showCopied() {
        if (!copyBtn) return;
        var label = copyBtn.querySelector('.copy-label');
        copyBtn.classList.add('is-copied');
        if (label) label.textContent = 'Copied';
        if (copyTimer) clearTimeout(copyTimer);
        copyTimer = setTimeout(function () {
          copyBtn.classList.remove('is-copied');
          if (label) label.textContent = 'Copy';
        }, 1800);
      }
      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          var text = copyBtn.getAttribute('data-copy') || '';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showCopied, function () {
              if (fallbackCopy(text)) showCopied();
            });
          } else if (fallbackCopy(text)) {
            showCopied();
          }
        });
      }
    })();
  </script>
